<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orario Primaria · dal 5 ottobre</title>
<style>
:root{
  --paper:#fbfcfe; --grid:#e3eaf5; --ink:#1b2a4a; --muted:#5b6782; --line:#cdd7e8;
  --blue:#2446a6; --blue-soft:#e6ecfb; --red:#c62828; --red-soft:#fdecea;
  --green:#3f8f1c; --green-soft:#e3f3d6; --cyan:#0a7fb0; --cyan-soft:#e0f3fb;
  --violet:#6b3fa0; --violet-soft:#efe7f8; --free:#eef1f6; --card:#ffffff;
  --display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121826; --grid:#1b2436; --ink:#e7ecf7; --muted:#9aa6c2; --line:#2c3850;
  --blue:#8fb0ff; --blue-soft:#1d2a4d; --red:#ff8a80; --red-soft:#3a1c1f;
  --green:#9ad874; --green-soft:#1f3318; --cyan:#6fd0f5; --cyan-soft:#10303d;
  --violet:#c9a6f5; --violet-soft:#2c2140; --free:#1a2130; --card:#161e2e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#121826; --grid:#1b2436; --ink:#e7ecf7; --muted:#9aa6c2; --line:#2c3850;
  --blue:#8fb0ff; --blue-soft:#1d2a4d; --red:#ff8a80; --red-soft:#3a1c1f;
  --green:#9ad874; --green-soft:#1f3318; --cyan:#6fd0f5; --cyan-soft:#10303d;
  --violet:#c9a6f5; --violet-soft:#2c2140; --free:#1a2130; --card:#161e2e; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1;margin:0;letter-spacing:-.02em}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:.95rem;color:var(--muted);letter-spacing:0;margin-top:6px}
.modes{display:inline-flex;background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:3px;gap:3px}
.modes button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.modes button:focus-visible,.pick:focus-visible,input:focus-visible,select:focus-visible,.sbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:820px){aside{position:static;max-height:none}}
input[type=search]{width:100%;font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.grp{margin-top:12px}
.grp h3{font-size:.8rem;color:var(--muted);font-weight:700;margin:0 0 6px;padding-left:2px}
.picks{display:flex;flex-wrap:wrap;gap:5px}
.pick{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 9px;border-radius:8px;cursor:pointer}
.pick:hover{border-color:var(--blue)}
.pick[aria-current="true"]{background:var(--blue);color:#fff;border-color:var(--blue)}
:root[data-theme="dark"] .pick[aria-current="true"]{color:#0c1224}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pick[aria-current="true"]{color:#0c1224}}
.cls .picks{display:grid;grid-template-columns:repeat(7,1fr)}
.cls .pick{text-align:center;padding:6px 0;font-weight:700}
main{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.title{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.title h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.5vw,2.1rem);margin:0;letter-spacing:-.01em}
.title .tag{font-size:.85rem;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.stats li{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--paper)}
.stats b{font-weight:700}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tt{width:100%;min-width:560px;border-collapse:separate;border-spacing:3px;table-layout:fixed}
.tt th{font-family:var(--display);font-weight:600;font-size:.9rem;padding:6px 2px;color:var(--muted)}
.tt th.h{width:34px;font-size:1rem;color:var(--ink)}
.tt th.today{color:var(--blue)}
.tt td{background:var(--paper);border:1px solid var(--line);border-radius:7px;height:46px;padding:4px 6px;vertical-align:middle;text-align:center;font-size:.92rem}
.tt td.c{background:var(--blue-soft);border-color:transparent;font-weight:700}
.tt td.d{background:var(--red-soft);color:var(--red);font-weight:700;border-color:transparent}
.tt td.A{background:var(--cyan-soft);color:var(--cyan);font-weight:700;border-color:transparent}
.tt td.alt{background:transparent;border-style:dashed;color:var(--muted);font-style:italic}
.tt td.free{background:repeating-linear-gradient(135deg,var(--free) 0 6px,transparent 6px 12px);color:var(--muted);font-size:.78rem}
.tt td.g{box-shadow:inset 0 0 0 2.5px var(--green)}
.tt td .sub{display:block;font-size:.72rem;font-weight:400;color:var(--muted);line-height:1.15;margin-top:2px}
.tt td.cl{text-align:left;font-size:.82rem;line-height:1.25;padding:5px 7px}
.tt td.cl.has{background:var(--blue-soft);border-color:transparent}
.who{display:block}
.who b{font-weight:700}
.who .r{font-size:.7rem;padding:0 4px;border-radius:4px;margin-left:3px;vertical-align:1px;font-weight:700}
.r.irc{background:var(--violet-soft);color:var(--violet)}
.r.alt{background:var(--cyan-soft);color:var(--cyan)}
.r.mot{background:var(--green-soft);color:var(--green)}
.r.mensa{background:var(--violet-soft);color:var(--violet)}
.tt td.cl a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.teamlist{margin-top:14px;font-size:.9rem}
.teamlist h4{margin:0 0 6px;font-size:.85rem;color:var(--muted)}
.teamlist ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.teamlist li button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer}
.teamlist li button small{color:var(--muted)}
/* sostituzioni */
.slotpick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.slotpick .days,.slotpick .hours{display:flex;gap:4px;flex-wrap:wrap}
.sbtn{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;min-width:38px;font-weight:700}
.sbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.box h3 em{font-style:normal;font-family:var(--body);font-size:.85rem;color:var(--muted)}
.box ul{list-style:none;margin:0;padding:0}
.box li{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:.93rem}
.box li:last-child{border-bottom:0}
.box li button{font:inherit;background:none;border:0;color:var(--ink);padding:0;cursor:pointer;text-align:left}
.box li button:hover{color:var(--blue);text-decoration:underline}
.box li span{color:var(--muted);font-size:.85rem;text-align:right}
.box.red h3{color:var(--red)} .box.green h3{color:var(--green)}
.empty{color:var(--muted);font-size:.9rem}
.note{font-size:.8rem;color:var(--muted);margin-top:20px}
.tools{display:flex;gap:8px;margin-left:auto}
.tools button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
@media print{
  body{background:#fff}aside,.modes,.tools,.note{display:none}.layout{display:block}.card{border:0;padding:0}
  .tt td{height:38px}
}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>

<div class="wrap">

  <p class="note">Dati trascritti dal PDF “Sc. Primaria – orario dal 5-10”. In caso di dubbio fa fede l’orario ufficiale affisso a scuola.</p>
</div>

"]},{},{},{}]},{"n":"Menchinelli","cat":"IRC","s":[{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{"k":"c","c":["4C"]},{"k":"c","c":["4C"]},{"k":"c","c":["1G"]},{"k":"c","c":["1G"]},{"k":"c","c":["3F"]},{"k":"c","c":["3F"]},{},{},{},{},{},{},{},{}]},{"n":"Vangi / Corso","cat":"IRC","s":[{},{},{},{},{},{},{},{},{},{},{},{"k":"c","c":["4F"]},{"k":"c","c":["4F"]},{},{"k":"c","c":["3B"]},{"k":"c","c":["3B"]},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{"k":"c","c":["5B"]},{"k":"c","c":["5B"]},{},{"k":"c","c":["3A"]},{"k":"c","c":["3A"]},{},{},{}]},{"n":"Incarico alternativa 1","cat":"Alternativa","s":[{},{},{},{},{"c":["1E"],"k":"c"},{"c":["1E"],"k":"c"},{"c":["2D","3D"],"k":"c"},{"c":["2D","3D"],"k":"c"},{"c":["1B","4A"],"k":"c"},{"c":["1B","4A"],"k":"c"},{"c":["4B"],"k":"c"},{"c":["4B"],"k":"c"},{},{},{"c":["2C","3B","4E"],"k":"c"},{"c":["2C","3B","4E"],"k":"c"},{"c":["1C"],"k":"c"},{"c":["1C"],"k":"c"},{"c":["1D","4D"],"k":"c"},{"c":["1D","4D"],"k":"c"},{},{},{},{},{"c":["3E"],"k":"c"},{"c":["3E"],"k":"c"},{"c":["3C","4C"],"k":"c"},{"c":["3C","4C"],"k":"c"},{},{},{},{},{"c":["2E"],"k":"c"},{"c":["2E"],"k":"c"},{},{"c":["1F","3A","5E"],"k":"c"},{"c":["1F","3A","5E"],"k":"c"},{},{},{}]},{"n":"Incarico alternativa 2","cat":"Alternativa","s":[{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{},{"c":["3F","5C"],"k":"c"},{"c":["3F","5C"],"k":"c"},{},{},{},{},{},{},{},{}]},{"n":"Ragusa","cat":"Motoria","s":[{},{},{},{},{"k":"c","c":["4B"]},{"k":"d"},{"k":"c","c":["5B"]},{"k":"c","c":["5D"]},{},{},{},{},{"k":"c","c":["5D"]},{"k":"c","c":["5A"],"m":1},{"k":"c","c":["5A"]},{"k":"c","c":["5A"]},{"k":"c","c":["4D"]},{"k":"c","c":["5E"]},{"k":"c","c":["4E"]},{"k":"c","c":["4F"]},{"k":"c","c":["4A"]},{},{},{},{"k":"c","c":["5C"]},{"k":"c","c":["5C"]},{"k":"c","c":["4B"]},{"k":"c","c":["5B"]},{"k":"c","c":["4A"]},{},{},{},{"k":"c","c":["4C"]},{"k":"c","c":["4C"]},{"k":"c","c":["4E"]},{"k":"c","c":["4D"]},{},{},{},{}]}];
const DAYS=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì"];
const DS=["Lun","Mar","Mer","Gio","Ven"];
const CAT={Classe:"Docenti di classe",IRC:"Religione cattolica (IRC)",Alternativa:"Materia alternativa",Motoria:"Motoria"};
const CLASSES=[...new Set(T.flatMap(t=>t.s.flatMap(s=>s.c||[])))].sort();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayIdx=(()=>{const d=new Date().getDay();return d>=1&&d<=5?d-1:0})();
let state={mode:"doc",doc:null,cls:null,day:todayIdx,hour:0,q:""};
function load(){
  try{const s=JSON.parse(localStorage.getItem("orario-primaria")||"{}");Object.assign(state,s)}catch(e){}
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("docente")){state.mode="doc";state.doc=h.get("docente")}
  if(h.get("classe")){state.mode="cls";state.cls=h.get("classe")}
  if(!T.find(t=>t.n===state.doc)) state.doc=T[0].n;
  if(!CLASSES.includes(state.cls)) state.cls=CLASSES[0];
  state.day=todayIdx; state.q="";
}
function save(){
  try{localStorage.setItem("orario-primaria",JSON.stringify({mode:state.mode,doc:state.doc,cls:state.cls}))}catch(e){}
  const hash=state.mode==="doc"?"docente="+encodeURIComponent(state.doc):state.mode==="cls"?"classe="+state.cls:"sostituzioni";
  try{if(location.protocol!=="file:")history.replaceState(null,"","#"+hash)}catch(e){}
}
function roleOf(t,s){
  if(t.cat==="IRC")return{k:"irc",l:"IRC"};
  if(t.cat==="Motoria")return{k:"mot",l:"Motoria"};
  if(t.cat==="Alternativa"||s.k==="A")return{k:"alt",l:"Alt."};
  return null;
}
/* ---------- sidebar ---------- */
function renderSide(){
  const side=document.getElementById("side");
  if(state.mode==="doc"){
    const q=state.q.trim().toLowerCase();
    let html=`<label for="q" class="grp" style="display:block;margin:0 0 6px;font-size:.85rem;color:var(--muted)">Cerca docente</label><input id="q" type="search" placeholder="es. Rossi" value="${esc(state.q)}" autocomplete="off">`;
    for(const cat of Object.keys(CAT)){
      const list=T.filter(t=>t.cat===cat&&t.n.toLowerCase().includes(q));
      if(!list.length)continue;
      html+=`<div class="grp"><h3>${CAT[cat]}</h3><div class="picks">${list.map(t=>`<button class="pick" data-doc="${esc(t.n)}" aria-current="${t.n===state.doc}">${esc(t.n)}</button>`).join("")}</div></div>`;
    }
    side.innerHTML=html;
    const inp=side.querySelector("#q");
    inp.addEventListener("input",e=>{state.q=e.target.value;renderSide();const i=document.getElementById("q");i.focus();i.setSelectionRange(i.value.length,i.value.length)});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=side.querySelector(".pick");if(f)f.click()}});
  }else if(state.mode==="cls"){
    let html="";
    for(const y of ["1","2","3","4","5"]){
      html+=`<div class="grp cls"><h3>Classi ${y}ª</h3><div class="picks">${CLASSES.filter(c=>c[0]===y).map(c=>`<button class="pick" data-cls="${c}" aria-current="${c===state.cls}">${c}</button>`).join("")}</div></div>`;
    }
    side.innerHTML=html;
  }else{
    side.innerHTML=`<div class="grp" style="margin-top:0"><h3>Come si usa</h3><p style="margin:0;font-size:.9rem">Scegli giorno e ora: vedi chi è a <b style="color:var(--red)">disposizione (d)</b>, chi è in <b style="color:var(--green)">compresenza con Ragusa</b>, chi ha il <b>turno alternato</b> (mattina e pomeriggio a settimane alterne) e chi ha il <b>giorno libero</b>.</p><p style="font-size:.85rem;color:var(--muted)">Per le coperture fa fede il libro delle sostituzioni.</p></div>`;
  }
  side.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{state.doc=b.dataset.doc;render();if(innerWidth<=820)try{document.getElementById("main").scrollIntoView({behavior:"smooth"})}catch(e){}});
  side.querySelectorAll("[data-cls]").forEach(b=>b.onclick=()=>{state.cls=b.dataset.cls;render();if(innerWidth<=820)try{document.getElementById("main").scrollIntoView({behavior:"smooth"})}catch(e){}});
}
/* ---------- grids ---------- */
function head(){return `<thead><tr><th class="h" scope="col">Ora</th>${DAYS.map((d,i)=>`<th scope="col" class="${i===todayIdx&&new Date().getDay()>=1&&new Date().getDay()<=5?"today":""}">${d}</th>`).join("")}</tr></thead>`}
function legend(){
  return `<div class="legend">
  <span><i class="sw" style="background:var(--blue-soft)"></i>in classe</span>
  <span><i class="sw" style="background:var(--red-soft)"></i><b style="color:var(--red)">d</b> disponibilità</span>
  <span><i class="sw" style="background:var(--cyan-soft)"></i><b style="color:var(--cyan)">A</b> materia alternativa</span>
  <span><i class="sw" style="box-shadow:inset 0 0 0 2.5px var(--green);background:var(--paper)"></i>compresenza con Ragusa</span>
  <span><i class="sw" style="border-style:dashed"></i><i>alt</i> turno alternato (mattina/pomeriggio a settimane alterne)</span>
  <span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--free) 0 3px,transparent 3px 6px)"></i>giorno libero</span>
  <span><b style="color:var(--violet)">M</b> mensa</span></div>`;
}
function renderDoc(){
  const t=T.find(x=>x.n===state.doc);
  const cnt={c:0,d:0,A:0,g:0};const cls=new Set();const free=new Set();
  t.s.forEach((s,i)=>{if(s.k==="c")cnt.c++;if(s.k==="d")cnt.d++;if(s.k==="A")cnt.A++;if(s.g)cnt.g++;(s.c||[]).forEach(c=>cls.add(c));if(s.k==="free")free.add(Math.floor(i/8))});
  let rows="";
  for(let h=0;h<8;h++){
    rows+=`<tr><th class="h" scope="row">${h+1}ª</th>`;
    for(let d=0;d<5;d++){
      const s=t.s[d*8+h]||{};let cl="",txt="";
      if(s.k==="free"){if(h===0){rows+=`<td class="free" rowspan="8">Giorno libero</td>`}continue}
      if(s.k==="c"){cl="c";txt=s.c.join(" · ");if(t.cat==="IRC")txt+=`<span class="sub">IRC</span>`;if(t.cat==="Motoria")txt+=`<span class="sub">motoria${s.m?" + mensa":""}</span>`;if(t.cat==="Alternativa")txt=s.c.join(" ")+`<span class="sub">alternativa</span>`}
      else if(s.k==="d"){cl="d";txt="d"}
      else if(s.k==="A"){cl="A";txt=`A${s.c&&s.c.length?`<span class="sub">${s.c.join(" ")}</span>`:""}`}
      else if(s.k==="alt"){cl="alt";txt=`alt<span class="sub">sett. alterne</span>`}
      if(s.g){cl+=" g";txt+=`<span class="sub" style="color:var(--green)">+ Ragusa</span>`}
      rows+=`<td class="${cl}">${txt}</td>`;
    }
    rows+="</tr>";
  }
  const stats=[`<li>In classe <b>${cnt.c}</b> h</li>`];
  if(cnt.A)stats.push(`<li>Alternativa <b>${cnt.A}</b> h</li>`);
  if(cnt.d)stats.push(`<li>Disponibilità <b>${cnt.d}</b> h</li>`);
  if(cnt.g)stats.push(`<li>Compresenza Ragusa <b>${cnt.g}</b> h</li>`);
  if(free.size)stats.push(`<li>Libero: <b>${[...free].map(i=>DAYS[i]).join(", ")}</b></li>`);
  const cl=[...cls].sort();
  return `<div class="card"><div class="title"><h2>${esc(t.n)}</h2><span class="tag">${CAT[t.cat]}</span><div class="tools"><button onclick="print()">Stampa</button></div></div>
  <ul class="stats">${stats.join("")}</ul>
  <div class="tw"><table class="tt">${head()}<tbody>${rows}</tbody></table></div>${legend()}
  ${cl.length?`<div class="teamlist"><h4>Classi</h4><ul>${cl.map(c=>`<li><button data-go-cls="${c}">${c}</button></li>`).join("")}</ul></div>`:""}</div>`;
}
function whoIn(cls,i){
  const out=[];
  for(const t of T){const s=t.s[i];if(s&&(s.c||[]).includes(cls))out.push({t,s,r:roleOf(t,s)})}
  out.sort((a,b)=>(a.r?1:0)-(b.r?1:0));
  return out;
}
function renderCls(){
  const c=state.cls;const team=new Map();let hours=0;
  let rows="";
  for(let h=0;h<8;h++){
    rows+=`<tr><th class="h" scope="row">${h+1}ª</th>`;
    for(let d=0;d<5;d++){
      const i=d*8+h;const w=whoIn(c,i);if(w.length)hours++;
      w.forEach(x=>{const k=x.t.n;team.set(k,(team.get(k)||0)+1)});
      const html=w.map(x=>`<span class="who"><a data-go-doc="${esc(x.t.n)}">${esc(x.t.n)}</a>${x.r?`<span class="r ${x.r.k}">${x.r.l}</span>`:""}${x.s.m?`<span class="r mensa">M</span>`:""}</span>`).join("");
      const g=w.some(x=>x.s.g);
      rows+=`<td class="cl ${w.length?"has":""} ${g?"g":""}">${html}</td>`;
    }
    rows+="</tr>";
  }
  const tl=[...team.entries()].sort((a,b)=>b[1]-a[1]);
  return `<div class="card"><div class="title"><h2>Classe ${c}</h2><span class="tag">${hours} ore settimanali</span><div class="tools"><button onclick="print()">Stampa</button></div></div>
  <div class="tw"><table class="tt">${head()}<tbody>${rows}</tbody></table></div>
  <div class="legend"><span><span class="r irc" style="padding:0 4px;border-radius:4px;font-weight:700">IRC</span> religione</span><span><span class="r alt" style="padding:0 4px;border-radius:4px;font-weight:700">Alt.</span> materia alternativa</span><span><span class="r mot" style="padding:0 4px;border-radius:4px;font-weight:700">Motoria</span> Ragusa</span><span><span class="r mensa" style="padding:0 4px;border-radius:4px;font-weight:700">M</span> mensa</span><span><i class="sw" style="box-shadow:inset 0 0 0 2.5px var(--green);background:var(--paper)"></i>compresenza con Ragusa</span></div>
  <div class="teamlist"><h4>Docenti della classe (ore/settimana)</h4><ul>${tl.map(([n,h])=>`<li><button data-go-doc="${esc(n)}">${esc(n)} <small>${h}</small></button></li>`).join("")}</ul></div></div>`;
}
function renderSub(){
  const i=state.day*8+state.hour;
  const d=[],g=[],fr=[],alt=[];
  for(const t of T){const s=t.s[i]||{};
    if(s.k==="d")d.push({n:t.n,x:t.cat==="Motoria"?"Motoria":""});
    if(s.g)g.push({n:t.n,x:s.c.join(" ")});
    if(s.k==="free"&&state.hour===0||s.k==="free")fr.push({n:t.n,x:""});
    if(s.k==="alt")alt.push({n:t.n,x:"sett. alterne"});
  }
  const frU=[...new Map(fr.map(x=>[x.n,x])).values()];
  const list=(arr,empty)=>arr.length?`<ul>${arr.map(x=>`<li><button data-go-doc="${esc(x.n)}">${esc(x.n)}</button><span>${esc(x.x)}</span></li>`).join("")}</ul>`:`<p class="empty">${empty}</p>`;
  return `<div class="card"><div class="title"><h2>${DAYS[state.day]}, ${state.hour+1}ª ora</h2><span class="tag">chi è disponibile per le coperture</span></div>
  <div class="slotpick"><div class="days" role="group" aria-label="Giorno">${DS.map((x,k)=>`<button class="sbtn" data-day="${k}" aria-pressed="${k===state.day}">${x}</button>`).join("")}</div>
  <div class="hours" role="group" aria-label="Ora">${[1,2,3,4,5,6,7,8].map((x,k)=>`<button class="sbtn" data-hour="${k}" aria-pressed="${k===state.hour}">${x}ª</button>`).join("")}</div></div>
  <div class="cols">
   <div class="box red"><h3>A disposizione (d) <em>${d.length}</em></h3>${list(d,"Nessun docente a disposizione in quest’ora.")}</div>
   <div class="box green"><h3>In compresenza con Ragusa <em>${g.length}</em></h3>${list(g,"Nessuna compresenza in quest’ora.")}</div>
   <div class="box"><h3>Turno alternato (alt) <em>${alt.length}</em></h3>${list(alt,"—")}</div>
   <div class="box"><h3>Giorno libero <em>${frU.length}</em></h3>${list(frU,"Nessuno.")}</div>
  </div></div>`;
}
function render(){
  document.querySelectorAll(".modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===state.mode));
  renderSide();
  const m=document.getElementById("main");
  m.innerHTML=state.mode==="doc"?renderDoc():state.mode==="cls"?renderCls():renderSub();
  m.querySelectorAll("[data-go-doc]").forEach(a=>{a.tabIndex=0;a.onclick=()=>{state.mode="doc";state.doc=a.dataset.goDoc;state.q="";render();scrollTo({top:0})};a.onkeydown=e=>{if(e.key==="Enter")a.click()}});
  m.querySelectorAll("[data-go-cls]").forEach(a=>a.onclick=()=>{state.mode="cls";state.cls=a.dataset.goCls;render();scrollTo({top:0})});
  m.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;render()});
  m.querySelectorAll("[data-hour]").forEach(b=>b.onclick=()=>{state.hour=+b.dataset.hour;render()});
  save();
}
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()});
load();render();
</script>
</body>
</html>
